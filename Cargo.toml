[package]
name = "ms2atoms"
version = "0.1.0"
edition = "2024"

[dependencies]
burn = { version = "0.20.1", features = ["metal", "train", "tui", "metrics"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
mascot-rs = { git = "https://github.com/LucaCappelletti94/mascot-rs" }
molecular-formulas = "0.1.9"
elements_rs = "0.2.7"
pollster = "0.4"
thiserror = "2.0.18"
rand = { version = "0.10.1", features = ["chacha"] }
mass_spectrometry = { git = "https://github.com/earth-metabolome-initiative/mass-spectrometry-traits" }
serde = "1.0.228"
csv = "1.4.0"
